# A persistent disk requires a paid service. Review charges before deploying.
services:
  - type: web
    name: airbnb-marketplace
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /data/airbnb.db
    disk:
      name: airbnb-data
      mountPath: /data
      sizeGB: 1
